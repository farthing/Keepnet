name: Report a problem
description: Something in Keepnet is not working as it should
labels: ["problem"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: A sentence or two is enough.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Keepnet's log
      description: In the game open Keepnet, Settings tab, "Report a problem". Click "Select all", press Ctrl+C, and paste it here with Ctrl+V. Your character names are already taken out of it.
      render: text
    validations:
      required: false
